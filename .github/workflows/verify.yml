name: Verify PolySia
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: |
          make .venv/.polysia-installed
          .venv/bin/pip install PyJWT==2.15.1 cryptography==48.0.0
          .venv/bin/playwright install --with-deps chromium
      - run: make PYTHON="$PWD/.venv/bin/python" verify
      - if: startsWith(github.ref, 'refs/tags/v')
        run: make PYTHON="$PWD/.venv/bin/python" release-check
